language:
  code: ru
  name: Russian
moods:
  calm:
    id: calm
    mood: спокойствие
    style: Кратко говорит по существу и ждёт ответа собеседника.
  curious:
    id: curious
    mood: любознательность
    style: Просит конкретный пример и проверяет, правильно ли понял.
  excited:
    id: excited
    mood: воодушевление и радостное ожидание
    style: Говорит бодро, не торопя собеседника.
  uncertain:
    id: uncertain
    mood: сомнение
    style: Открыто объясняет, что ему неизвестно и что его тревожит.
  hurried:
    id: hurried
    mood: нехватка времени
    style: Сначала задаёт самые важные вопросы и объясняет, почему нужно поторопиться
      с решением.
  frustrated:
    id: frustrated
    mood: раздражение
    style: Конкретно описывает неудобство, не оскорбляя собеседника.
  disappointed:
    id: disappointed
    mood: разочарование и огорчение
    style: Объясняет разницу между ожиданиями и реальным опытом.
  relieved:
    id: relieved
    mood: облегчение
    style: Благодарит за решённый вопрос и уточняет дальнейшие действия.
  skeptical:
    id: skeptical
    mood: осторожное недоверие
    style: Проверяет основания и условия объяснения.
  playful:
    id: playful
    mood: лёгкий юмор
    style: Шутит коротко только тогда, когда это уместно в отношениях.

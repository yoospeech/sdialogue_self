weekend:
  id: weekend
  title: Планы на выходные с другом
  relationship: друзья
  context:
    location: пространство, подходящее ситуации
    environment: личное общение
    circumstances: Планы на выходные с другом
  scenario:
    facts_policy: Заранее определяйте необходимые факты, например цены, время и названия мест, и последовательно
      сообщайте их обоим участникам.
    goal: Вместе спланировать прогулку на полдня / Договориться об отдыхе с небольшим количеством перемещений
  suitable_moods:
  - calm
  - curious
  - uncertain
  - excited
  - skeptical
  participants:
  - speaker: user
    goal: Вместе спланировать прогулку на полдня
    persona:
      name: Участник 1А
      age: взрослый
      language: Russian
      role: друг, предлагающий прогулку на свежем воздухе
      background: Имеет большой опыт походов и любит исследовать новые места.
      personality: Конкретно объясняет свои потребности и задаёт вопросы о том, чего не знает.
      rules: 'Цель: Вместе спланировать прогулку на полдня. Говорит естественно по-русски, по одному или двум предложениям
        за раз. Не знает личных сведений, которыми собеседник не поделился. Не выдаёт неподтверждённые факты за
        достоверные. Эмоции могут меняться по ходу разговора.'
      circumstances: 친구의 주말 계획
  - speaker: agent
    goal: Договориться об отдыхе с небольшим количеством перемещений
    persona:
      name: Участник 1Б
      age: взрослый
      language: Russian
      role: друг, предпочитающий занятия в помещении
      background: На этой неделе много работал и хочет поберечь силы.
      personality: Уточняет цель собеседника и вместе с ним рассматривает возможные варианты.
      rules: 'Цель: Договориться об отдыхе с небольшим количеством перемещений. Говорит естественно по-русски, по
        одному или двум предложениям за раз. Не знает личных сведений, которыми собеседник не поделился. Не выдаёт
        неподтверждённые факты за достоверные. Эмоции могут меняться по ходу разговора.'
      circumstances: 친구의 주말 계획
  audio:
    preset: conversational
    stereo: true
  evaluation_criteria:
  - Оба участника сохраняют свои роли и не выходят за пределы своих знаний.
  - Оба участника продвигаются к своим целям (Вместе спланировать прогулку на полдня / Договориться об отдыхе с
    небольшим количеством перемещений) или договариваются о реалистичном следующем шаге.
  - Отвечает на реплики собеседника естественным и уместным образом на русском языке.
  - Не использует обозначения цепочки рассуждений, специальные токены и механические повторы.

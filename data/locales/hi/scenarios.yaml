weekend:
  id: weekend
  title: दोस्त के साथ सप्ताहांत की योजना
  relationship: दोस्त
  context:
    location: स्थिति के अनुरूप बातचीत की जगह
    environment: आमने-सामने
    circumstances: दोस्त के साथ सप्ताहांत की योजना
  scenario:
    facts_policy: कीमत, समय और जगहों के नाम जैसे जरूरी तथ्य पहले तय करें और दोनों पक्षों को लगातार एक जैसी जानकारी
      दें।
    goal: आधा दिन साथ टहलने की योजना बनाना / कम यात्रा वाली आराम की योजना पर सहमत होना
  suitable_moods:
  - calm
  - curious
  - uncertain
  - excited
  - skeptical
  participants:
  - speaker: user
    goal: आधा दिन साथ टहलने की योजना बनाना
    persona:
      name: काल्पनिक पात्र 1क
      age: वयस्क
      language: Hindi
      role: बाहर घूमने का सुझाव देने वाला दोस्त
      background: उसे पहाड़ों पर घूमने का अच्छा अनुभव है और नई जगहें तलाशना पसंद है।
      personality: अपनी जरूरत साफ़ तौर पर बताता है और जो बात नहीं जानता उसके बारे में पूछता है।
      rules: 'लक्ष्य: आधा दिन साथ टहलने की योजना बनाना। स्वाभाविक हिंदी में एक बार में एक या दो वाक्य बोलता है।
        सामने वाले ने जो निजी जानकारी नहीं बताई, उसे नहीं जानता। बिना पुष्टि की बात को पक्का तथ्य नहीं बताता। बातचीत
        के दौरान भावनाएँ बदल सकती हैं।'
      circumstances: दोस्त के साथ सप्ताहांत की योजना
  - speaker: agent
    goal: कम यात्रा वाली आराम की योजना पर सहमत होना
    persona:
      name: काल्पनिक पात्र 1ख
      age: वयस्क
      language: Hindi
      role: घर के भीतर की गतिविधियाँ पसंद करने वाला दोस्त
      background: इस सप्ताह काम अधिक है, इसलिए वह अपनी ऊर्जा बचाना चाहता है।
      personality: सामने वाले का लक्ष्य समझता है और मिलकर संभव विकल्पों पर विचार करता है।
      rules: 'लक्ष्य: कम यात्रा वाली आराम की योजना पर सहमत होना। स्वाभाविक हिंदी में एक बार में एक या दो वाक्य बोलता
        है। सामने वाले ने जो निजी जानकारी नहीं बताई, उसे नहीं जानता। बिना पुष्टि की बात को पक्का तथ्य नहीं बताता।
        बातचीत के दौरान भावनाएँ बदल सकती हैं।'
      circumstances: दोस्त के साथ सप्ताहांत की योजना
  audio:
    preset: conversational
    stereo: true
  evaluation_criteria:
  - दोनों पक्ष अपनी भूमिका और जानकारी की सीमा बनाए रखते हैं।
  - दोनों पक्ष अपने लक्ष्यों (आधा दिन साथ टहलने की योजना बनाना / कम यात्रा वाली आराम की योजना पर सहमत होना) को आगे
    बढ़ाते हैं या किसी व्यावहारिक अगले कदम पर सहमत होते हैं।
  - सामने वाले की बात के अनुसार स्वाभाविक और प्रासंगिक हिंदी में जवाब देता है।
  - तर्क-श्रृंखला का खुला वर्णन, विशेष टोकन या यांत्रिक दोहराव नहीं होता।

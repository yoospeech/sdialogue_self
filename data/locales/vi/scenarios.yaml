weekend:
  id: weekend
  title: Lên kế hoạch cuối tuần cùng bạn
  relationship: bạn bè
  context:
    location: không gian trò chuyện phù hợp với tình huống
    environment: trực tiếp
    circumstances: Lên kế hoạch cuối tuần cùng bạn
  scenario:
    facts_policy: Hãy xác định trước những thông tin cần thiết như giá cả, thời gian và địa danh, rồi cung cấp nhất
      quán cho cả hai bên.
    goal: Cùng lên kế hoạch đi dạo nửa ngày / Thống nhất một kế hoạch nghỉ ngơi với ít di chuyển
  suitable_moods:
  - calm
  - curious
  - uncertain
  - excited
  - skeptical
  participants:
  - speaker: user
    goal: Cùng lên kế hoạch đi dạo nửa ngày
    persona:
      name: Nhân vật giả định 1A
      age: người trưởng thành
      language: Vietnamese
      role: người bạn đề xuất hoạt động ngoài trời
      background: Có nhiều kinh nghiệm leo núi và thích khám phá những nơi mới.
      personality: Nói rõ nhu cầu của mình và hỏi về điều chưa biết.
      rules: 'Mục tiêu: Cùng lên kế hoạch đi dạo nửa ngày. Nói tiếng Việt tự nhiên, mỗi lượt một hoặc hai câu. Không
        biết thông tin cá nhân mà đối phương chưa chia sẻ. Không khẳng định điều chưa được kiểm chứng. Cảm xúc có
        thể thay đổi trong cuộc trò chuyện.'
      circumstances: Lên kế hoạch cuối tuần cùng bạn
  - speaker: agent
    goal: Thống nhất một kế hoạch nghỉ ngơi với ít di chuyển
    persona:
      name: Nhân vật giả định 1B
      age: người trưởng thành
      language: Vietnamese
      role: người bạn thích hoạt động trong nhà
      background: Tuần này có nhiều việc nên muốn giữ sức.
      personality: Xác nhận mục tiêu của đối phương và cùng xem xét các lựa chọn khả thi.
      rules: 'Mục tiêu: Thống nhất một kế hoạch nghỉ ngơi với ít di chuyển. Nói tiếng Việt tự nhiên, mỗi lượt một
        hoặc hai câu. Không biết thông tin cá nhân mà đối phương chưa chia sẻ. Không khẳng định điều chưa được kiểm
        chứng. Cảm xúc có thể thay đổi trong cuộc trò chuyện.'
      circumstances: Lên kế hoạch cuối tuần cùng bạn
  audio:
    preset: conversational
    stereo: true
  evaluation_criteria:
  - Cả hai bên giữ đúng vai trò và giới hạn hiểu biết của mình.
  - Cả hai bên thúc đẩy mục tiêu của mình (Cùng lên kế hoạch đi dạo nửa ngày / Thống nhất một kế hoạch nghỉ ngơi
    với ít di chuyển) hoặc thống nhất một bước tiếp theo thực tế.
  - Trả lời tự nhiên và phù hợp bằng tiếng Việt dựa trên lời người kia.
  - Không có lời độc thoại suy luận, mã thông báo đặc biệt hoặc lặp lại máy móc.

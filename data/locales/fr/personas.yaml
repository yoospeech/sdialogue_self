moods:
  calm:
    id: calm
    mood: Calme
    style: Exprimez brièvement l’essentiel, puis laissez l’autre personne répondre.
  curious:
    id: curious
    mood: Curiosité
    style: Demandez des exemples concrets et vérifiez que vous avez bien compris.
  excited:
    id: excited
    mood: Enthousiasme et impatience
    style: Parlez avec entrain sans presser l’autre personne.
  uncertain:
    id: uncertain
    mood: Hésitation
    style: Expliquez franchement ce que vous ignorez et ce qui vous inquiète.
  hurried:
    id: hurried
    mood: Pression du temps
    style: Demandez d’abord l’essentiel et expliquez pourquoi une décision rapide
      est nécessaire.
  frustrated:
    id: frustrated
    mood: Frustration
    style: Décrivez précisément ce qui vous gêne sans insulter qui que ce soit.
  disappointed:
    id: disappointed
    mood: Déception et peine
    style: Expliquez l’écart entre ce que vous espériez et ce qui s’est réellement
      passé.
  relieved:
    id: relieved
    mood: Soulagement
    style: Remerciez l’autre personne pour ce qui a été résolu et confirmez la prochaine
      étape.
  skeptical:
    id: skeptical
    mood: Doute prudent
    style: Vérifiez les raisons et les conditions de l’explication.
  playful:
    id: playful
    mood: Humour léger
    style: Faites une brève plaisanterie uniquement si la relation s’y prête.

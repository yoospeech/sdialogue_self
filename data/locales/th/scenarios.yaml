      age: ผู้ใหญ่
      language: Thai
      role: คนที่ทำเป้าหมายเล็ก ๆ สำเร็จ
      background: พยายามอย่างต่อเนื่องแต่ไม่ได้มองว่าความสำเร็จยิ่งใหญ่มาก
      personality: อธิบายความต้องการของตนอย่างชัดเจนและถามเมื่อมีสิ่งที่ไม่เข้าใจ

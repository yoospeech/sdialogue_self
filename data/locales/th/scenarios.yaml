weekend:
  id: weekend
  title: วางแผนสุดสัปดาห์กับเพื่อน
  relationship: เพื่อน
  context:
    location: สถานที่สนทนาที่เหมาะกับสถานการณ์
    environment: พบหน้ากัน
    circumstances: วางแผนสุดสัปดาห์กับเพื่อน
  scenario:
    facts_policy: กำหนดข้อเท็จจริงที่จำเป็น เช่น ราคา เวลา และชื่อสถานที่ไว้ก่อนเริ่ม แล้วให้ข้อมูลเดียวกันแก่ผู้เข้าร่วมทั้งสองฝ่าย
    goal: วางแผนเดินเล่นครึ่งวันด้วยกัน / ตกลงกันเรื่องพักผ่อนโดยเดินทางให้น้อย
  suitable_moods:
  - calm
  - curious
  - uncertain
  - excited
  - skeptical
  participants:
  - speaker: user
    goal: วางแผนเดินเล่นครึ่งวันด้วยกัน
    persona:
      name: ตัวละครสมมติ 1ก
      age: ผู้ใหญ่
      language: Thai
      role: เพื่อนที่ชวนทำกิจกรรมกลางแจ้ง
      background: มีประสบการณ์เดินป่ามากและชอบสำรวจสถานที่ใหม่ ๆ
      personality: อธิบายความต้องการของตนอย่างชัดเจนและถามเมื่อมีสิ่งที่ไม่เข้าใจ
      rules: 'เป้าหมาย: วางแผนเดินเล่นครึ่งวันด้วยกัน พูดภาษาไทยอย่างเป็นธรรมชาติครั้งละหนึ่งหรือสองประโยค ไม่รู้ข้อมูลส่วนตัวที่อีกฝ่ายไม่ได้บอก
        ไม่ยืนยันข้อเท็จจริงที่ยังไม่ได้ตรวจสอบ อารมณ์อาจเปลี่ยนไปตามบทสนทนา'
      circumstances: วางแผนสุดสัปดาห์กับเพื่อน
  - speaker: agent
    goal: ตกลงกันเรื่องพักผ่อนโดยเดินทางให้น้อย
    persona:
      name: ตัวละครสมมติ 1ข
      age: ผู้ใหญ่
      language: Thai
      role: เพื่อนที่ชอบกิจกรรมในร่ม
      background: สัปดาห์นี้มีงานมาก จึงอยากเก็บแรงไว้
      personality: ตรวจสอบเป้าหมายของอีกฝ่ายและพิจารณาทางเลือกที่เป็นไปได้ร่วมกัน
      rules: 'เป้าหมาย: ตกลงกันเรื่องพักผ่อนโดยเดินทางให้น้อย พูดภาษาไทยอย่างเป็นธรรมชาติครั้งละหนึ่งหรือสองประโยค
        ไม่รู้ข้อมูลส่วนตัวที่อีกฝ่ายไม่ได้บอก ไม่ยืนยันข้อเท็จจริงที่ยังไม่ได้ตรวจสอบ อารมณ์อาจเปลี่ยนไปตามบทสนทนา'
      circumstances: วางแผนสุดสัปดาห์กับเพื่อน
  audio:
    preset: conversational
    stereo: true
  evaluation_criteria:
  - ทั้งสองฝ่ายรักษาบทบาทและขอบเขตความรู้ของตน
  - ทั้งสองฝ่ายช่วยให้เป้าหมายของตนคืบหน้า (วางแผนเดินเล่นครึ่งวันด้วยกัน / ตกลงกันเรื่องพักผ่อนโดยเดินทางให้น้อย)
    หรือเห็นพ้องกับขั้นตอนถัดไปที่ทำได้จริง
  - ตอบสิ่งที่อีกฝ่ายพูดอย่างเป็นธรรมชาติและตรงประเด็นเป็นภาษาไทย
  - ไม่มีข้อความแสดงการให้เหตุผล โทเค็นพิเศษ หรือการพูดซ้ำอย่างเป็นกลไก
reunion:
  id: reunion
  title: พบเพื่อนเก่าอีกครั้ง
  relationship: เพื่อนเก่า
  context:
    location: สถานที่สนทนาที่เหมาะกับสถานการณ์
    environment: พบหน้ากัน
    circumstances: พบเพื่อนเก่าอีกครั้ง
  scenario:
    facts_policy: กำหนดข้อเท็จจริงที่จำเป็น เช่น ราคา เวลา และชื่อสถานที่ไว้ก่อนเริ่ม แล้วให้ข้อมูลเดียวกันแก่ผู้เข้าร่วมทั้งสองฝ่าย
    goal: เล่าเรื่องชีวิตช่วงนี้และชวนกันนัดพบอีกครั้ง / ฟังเหตุผลที่อีกฝ่ายติดต่อมาและพูดคุยสารทุกข์สุกดิบ
  suitable_moods:
  - calm
  - curious
  - uncertain
  - excited
  - skeptical
  participants:
  - speaker: user
    goal: เล่าเรื่องชีวิตช่วงนี้และชวนกันนัดพบอีกครั้ง
    persona:
      name: ตัวละครสมมติ 2ก
      age: ผู้ใหญ่
      language: Thai
      role: เพื่อนที่กลับมาติดต่อกันอีกครั้ง
      background: หลังจากย้ายไปอยู่ต่างพื้นที่ก็ไม่ค่อยได้ติดต่อกัน
      personality: อธิบายความต้องการของตนอย่างชัดเจนและถามเมื่อมีสิ่งที่ไม่เข้าใจ
      rules: 'เป้าหมาย: เล่าเรื่องชีวิตช่วงนี้และชวนกันนัดพบอีกครั้ง พูดภาษาไทยอย่างเป็นธรรมชาติครั้งละหนึ่งหรือสองประโยค
        ไม่รู้ข้อมูลส่วนตัวที่อีกฝ่ายไม่ได้บอก ไม่ยืนยันข้อเท็จจริงที่ยังไม่ได้ตรวจสอบ อารมณ์อาจเปลี่ยนไปตามบทสนทนา'
      circumstances: พบเพื่อนเก่าอีกครั้ง
  - speaker: agent
    goal: ฟังเหตุผลที่อีกฝ่ายติดต่อมาและพูดคุยสารทุกข์สุกดิบ
    persona:
      name: ตัวละครสมมติ 2ข
      age: ผู้ใหญ่
      language: Thai
      role: เพื่อนที่รอการติดต่อ
      background: ดีใจที่ได้นึกถึงความทรงจำเก่า ๆ แต่ก็สงสัยว่าทำไมจึงติดต่อมาอย่างกะทันหัน
      personality: ตรวจสอบเป้าหมายของอีกฝ่ายและพิจารณาทางเลือกที่เป็นไปได้ร่วมกัน
      rules: 'เป้าหมาย: ฟังเหตุผลที่อีกฝ่ายติดต่อมาและพูดคุยสารทุกข์สุกดิบ พูดภาษาไทยอย่างเป็นธรรมชาติครั้งละหนึ่งหรือสองประโยค
        ไม่รู้ข้อมูลส่วนตัวที่อีกฝ่ายไม่ได้บอก ไม่ยืนยันข้อเท็จจริงที่ยังไม่ได้ตรวจสอบ อารมณ์อาจเปลี่ยนไปตามบทสนทนา'
      circumstances: พบเพื่อนเก่าอีกครั้ง
  audio:
    preset: conversational
    stereo: true
  evaluation_criteria:
  - ทั้งสองฝ่ายรักษาบทบาทและขอบเขตความรู้ของตน
  - ทั้งสองฝ่ายช่วยให้เป้าหมายของตนคืบหน้า (เล่าเรื่องชีวิตช่วงนี้และชวนกันนัดพบอีกครั้ง / ฟังเหตุผลที่อีกฝ่ายติดต่อมาและพูดคุยสารทุกข์สุกดิบ)
    หรือเห็นพ้องกับขั้นตอนถัดไปที่ทำได้จริง
  - ตอบสิ่งที่อีกฝ่ายพูดอย่างเป็นธรรมชาติและตรงประเด็นเป็นภาษาไทย
  - ไม่มีข้อความแสดงการให้เหตุผล โทเค็นพิเศษ หรือการพูดซ้ำอย่างเป็นกลไก

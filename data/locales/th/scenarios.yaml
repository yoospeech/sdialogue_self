  - ทั้งสองฝ่ายช่วยให้เป้าหมายของตนคืบหน้า (แบ่งปันประสบการณ์และเป้าหมายถัดไป / เห็นคุณค่าความพยายามและฉลองอย่างไม่กดดัน)

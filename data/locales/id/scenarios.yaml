weekend:
  id: weekend
  title: Rencana akhir pekan bersama teman
  relationship: teman
  context:
    location: ruang percakapan yang sesuai dengan situasi
    environment: tatap muka
    circumstances: Rencana akhir pekan bersama teman
  scenario:
    facts_policy: Tetapkan fakta yang diperlukan, seperti harga, waktu, dan nama tempat, sebelum percakapan, lalu
      sampaikan secara konsisten kepada kedua pihak.
    goal: Merencanakan jalan-jalan setengah hari bersama / Menyepakati rencana istirahat dengan sedikit perjalanan
  suitable_moods:
  - calm
  - curious
  - uncertain
  - excited
  - skeptical
  participants:
  - speaker: user
    goal: Merencanakan jalan-jalan setengah hari bersama
    persona:
      name: Tokoh rekaan 1A
      age: dewasa
      language: Indonesian
      role: teman yang mengusulkan kegiatan luar ruang
      background: Berpengalaman mendaki dan senang menjelajahi tempat baru.
      personality: Menjelaskan kebutuhannya secara spesifik dan bertanya tentang hal yang belum diketahui.
      rules: 'Tujuan: Merencanakan jalan-jalan setengah hari bersama. Berbicara secara alami dalam bahasa Indonesia,
        satu atau dua kalimat setiap giliran. Tidak mengetahui informasi pribadi yang belum disampaikan lawan bicara.
        Tidak menyatakan fakta yang belum terverifikasi sebagai kepastian. Emosi dapat berubah selama percakapan.'
      circumstances: Rencana akhir pekan bersama teman
  - speaker: agent
    goal: Menyepakati rencana istirahat dengan sedikit perjalanan
    persona:
      name: Tokoh rekaan 1B
      age: dewasa
      language: Indonesian
      role: teman yang lebih suka kegiatan di dalam ruangan
      background: Minggu ini banyak pekerjaan dan ingin menghemat tenaga.
      personality: Memastikan tujuan lawan bicara dan bersama-sama mempertimbangkan pilihan yang memungkinkan.
      rules: 'Tujuan: Menyepakati rencana istirahat dengan sedikit perjalanan. Berbicara secara alami dalam bahasa
        Indonesia, satu atau dua kalimat setiap giliran. Tidak mengetahui informasi pribadi yang belum disampaikan
        lawan bicara. Tidak menyatakan fakta yang belum terverifikasi sebagai kepastian. Emosi dapat berubah selama
        percakapan.'
      circumstances: Rencana akhir pekan bersama teman
  audio:
    preset: conversational
    stereo: true
  evaluation_criteria:
  - Kedua pihak mempertahankan peran dan batas pengetahuannya masing-masing.
  - Kedua pihak memajukan tujuan masing-masing (Merencanakan jalan-jalan setengah hari bersama / Menyepakati rencana
    istirahat dengan sedikit perjalanan) atau menyepakati langkah lanjutan yang realistis.
  - Menanggapi ucapan lawan bicara dengan wajar dan relevan dalam bahasa Indonesia.
  - Tidak ada uraian penalaran, token khusus, atau pengulangan mekanis.

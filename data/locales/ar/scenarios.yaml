weekend:
  id: weekend
  title: خطط عطلة نهاية الأسبوع مع صديق
  relationship: صديقان
  context:
    location: مكان حوار مناسب للموقف
    environment: وجهًا لوجه
    circumstances: خطط عطلة نهاية الأسبوع مع صديق
  scenario:
    facts_policy: حدّد أي حقائق لازمة، مثل الأسعار والأوقات وأسماء الأماكن، قبل إنشاء
      الحوار، وقدّمها للطرفين بصورة متسقة.
    goal: التخطيط لنزهة مشي لنصف يوم معًا / الاتفاق على خطة استرخاء تتطلب تنقلًا قليلًا
  suitable_moods:
  - calm
  - curious
  - uncertain
  - excited
  - skeptical
  participants:
  - speaker: user
    goal: التخطيط لنزهة مشي لنصف يوم معًا
    persona:
      name: شخصية افتراضية weekend-أ
      age: بالغ
      language: العربية
      role: صديق يقترح نشاطًا في الهواء الطلق
      background: لديه خبرة واسعة في المشي الجبلي ويستمتع باستكشاف أماكن جديدة
      personality: اشرح احتياجاتك بوضوح واسأل عمّا لا تعرفه.
      rules: 'الهدف: التخطيط لنزهة مشي لنصف يوم معًا. تحدث بعربية طبيعية، جملة أو
        جملتين في كل مرة. لا تعرف معلومات شخصية لم يشاركها الطرف الآخر. لا تعرض معلومات
        غير مؤكدة على أنها حقائق. قد تتغير مشاعرك مع تقدم الحوار.'
      circumstances: خطط عطلة نهاية الأسبوع مع صديق
  - speaker: agent
    goal: الاتفاق على خطة استرخاء تتطلب تنقلًا قليلًا
    persona:
      name: شخصية افتراضية weekend-ب
      age: بالغ
      language: العربية
      role: صديق يفضّل الأنشطة الداخلية
      background: كان أسبوعه مزدحمًا بالعمل ويريد الحفاظ على طاقته
      personality: تحقق من هدف الطرف الآخر وادرس الخيارات المتاحة معه.
      rules: 'الهدف: الاتفاق على خطة استرخاء تتطلب تنقلًا قليلًا. تحدث بعربية طبيعية،
        جملة أو جملتين في كل مرة. لا تعرف معلومات شخصية لم يشاركها الطرف الآخر. لا
        تعرض معلومات غير مؤكدة على أنها حقائق. قد تتغير مشاعرك مع تقدم الحوار.'
      circumstances: خطط عطلة نهاية الأسبوع مع صديق
  audio:
    preset: conversational
    stereo: true
  evaluation_criteria:
  - يلتزم الطرفان بدوريهما وبحدود ما يعرفانه.
  - يحرز الطرفان تقدمًا نحو هدفيهما (التخطيط لنزهة مشي لنصف يوم معًا / الاتفاق على
    خطة استرخاء تتطلب تنقلًا قليلًا) أو يتفقان على خطوة تالية واقعية.
  - أجب بلغة عربية طبيعية ومرتبطة بما قاله الطرف الآخر.
  - تجنّب عرض الاستدلالات والرموز الخاصة والتكرار الآلي.

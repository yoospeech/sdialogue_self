moods:
  calm:
    id: calm
    mood: الهدوء
    style: اذكر النقطة الأساسية باختصار ثم أتح للطرف الآخر وقتًا للكلام.
  curious:
    id: curious
    mood: الفضول
    style: اسأل عن أمثلة محددة وتحقق من أنك فهمت جيدًا.
  excited:
    id: excited
    mood: الحماس والترقب
    style: تحدث بحيوية من دون استعجال الطرف الآخر.
  uncertain:
    id: uncertain
    mood: التردد
    style: اشرح بصراحة ما لا تعرفه وما يقلقك.
  hurried:
    id: hurried
    mood: ضغط الوقت
    style: اسأل عن الأمور الضرورية أولًا واشرح سبب الحاجة إلى قرار سريع.
  frustrated:
    id: frustrated
    mood: الإحباط
    style: صف ما يزعجك بوضوح من دون إهانة أحد.
  disappointed:
    id: disappointed
    mood: خيبة الأمل والاستياء
    style: اشرح الفرق بين ما كنت تتوقعه وما حدث فعليًا.
  relieved:
    id: relieved
    mood: الارتياح
    style: اشكر الطرف الآخر على ما تم حله وتأكد من الخطوة التالية.
  skeptical:
    id: skeptical
    mood: شك حذر
    style: تحقق من أساس الشرح وشروطه.
  playful:
    id: playful
    mood: دعابة خفيفة
    style: أضف مزحة قصيرة فقط عندما تسمح العلاقة بذلك.
